server {
    listen 80;
    server_name _;

    # Aumenta limite pra uploads (multer) — ajuste se precisar de arquivos maiores
    client_max_body_size 25m;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA: qualquer rota desconhecida cai no index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API do back-end (Express escuta em backend:5000, rotas sob /api)
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos enviados (uploads estáticos servidos pelo Express)
    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
    }

    # WebSocket (chat em tempo real — pronto pra quando o socket.io for ligado)
    location /socket.io/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
    }
}
