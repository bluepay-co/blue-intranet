# Log estruturado em JSON — permite filtrar por IP, rota, status no Grafana/Loki
log_format json_logs escape=json
    '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

# Redireciona todo HTTP para HTTPS
server {
    listen 80;
    server_name bluepay-intranet.com.br;
    return 301 https://$host$request_uri;
}

# Endpoint interno para métricas do Nginx (consumido pelo nginx-exporter)
# Escuta na porta 8080, acessível apenas dentro da rede Docker.
server {
    listen 8080;
    server_name _;

    location /nginx_status {
        stub_status on;
        access_log off;
    }
}

server {
    listen 443 ssl;
    server_name bluepay-intranet.com.br;

    # Usa log JSON (parseável pelo Loki/Promtail)
    access_log /var/log/nginx/access.log json_logs;

    # Certificado Let's Encrypt (desafio DNS), montado via docker-compose (./certs)
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Aumenta limite pra uploads (multer) — ajuste se precisar de arquivos maiores
    client_max_body_size 25m;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA: qualquer rota desconhecida cai no index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API do back-end (Express escuta em backend:5000, rotas sob /api)
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos enviados (uploads estáticos servidos pelo Express)
    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
    }

    # WebSocket (chat em tempo real — pronto pra quando o socket.io for ligado)
    location /socket.io/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
    }

    # ── Grafana — dashboards de monitoramento ────────────────────────────
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket para Grafana Live (alertas em tempo real, streaming)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
