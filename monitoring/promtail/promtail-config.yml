server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ── Descoberta automática de containers Docker ──────────────────────────
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Usa o nome do container como label "container"
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      # Adiciona o nome do compose service como label
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
      # Adiciona o nome do projeto compose
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: "project"
    pipeline_stages:
      # ── Nginx (JSON): parseia campos e classifica o tráfego por área ─────
      - match:
          selector: '{service="frontend"}'
          stages:
            - json:
                expressions:
                  remote_addr: remote_addr
                  request_method: request_method
                  request_uri: request_uri
                  status: status
                  body_bytes_sent: body_bytes_sent
                  request_time: request_time
                  http_user_agent: http_user_agent
            # O mesmo nginx serve a intranet E o Grafana. Sem separar, as
            # consultas do próprio Grafana entram na estatística da API e
            # distorcem o "top rotas"/"total de requisições".
            - template:
                source: area
                template: '{{ if hasPrefix "/grafana" .request_uri }}grafana{{ else if hasPrefix "/api/" .request_uri }}api{{ else if hasPrefix "/socket.io" .request_uri }}socket{{ else if hasPrefix "/uploads/" .request_uri }}uploads{{ else }}site{{ end }}'
            # `remote_addr` NÃO vira label: cada IP criaria um stream novo no
            # índice do Loki. Continua na linha, extraído na query com `| json`.
            - labels:
                area:
                request_method:
                status:
      # O próprio Grafana era a maior parte do volume de log e não diz nada
      # sobre o uso da intranet. As linhas são descartadas (disco da VM), mas
      # o contador logentry_dropped_lines_total segue no /metrics do promtail.
      - match:
          selector: '{service="frontend", area="grafana"}'
          action: drop
          drop_counter_reason: trafego_grafana

      # ── Back-end (JSON estruturado de utils/log.ts) ──────────────────────
      - match:
          selector: '{service="backend"} |= "\"evento\":"'
          stages:
            - json:
                expressions:
                  nivel: nivel
                  evento: evento
            - labels:
                nivel:
                evento:
      # Linhas soltas do back-end (libs, console.log antigo): detecta o nível
      - match:
          selector: '{service="backend"} != "\"evento\":"'
          stages:
            - regex:
                expression: '(?i)(?P<nivel>error|warn|info|debug)'
            - labels:
                nivel:

      # ── Demais containers: detecta nível de log nos logs brutos ──────────
      - match:
          selector: '{service!="frontend", service!="backend"}'
          stages:
            - regex:
                expression: '(?i)(?P<level>error|warn|info|debug)'
            - labels:
                level:
