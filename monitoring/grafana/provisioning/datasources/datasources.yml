apiVersion: 1

datasources:
  # Prometheus — fonte principal de métricas (VM, containers, Postgres, Nginx)
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  # Loki — logs agregados de todos os containers
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
