# ============================================================================
#  Grafana — configuração para servir sob /grafana/ (via Nginx reverse proxy)
# ============================================================================

[server]
# Subpath: acessível em https://bluepay-intranet.com.br/grafana/
root_url = %(protocol)s://%(domain)s/grafana/
serve_from_sub_path = true

[security]
# Senha do admin vem da env var GF_SECURITY_ADMIN_PASSWORD (docker-compose)
admin_user = admin

[users]
# Desabilita signup público — só o admin cria contas
allow_sign_up = false

[auth.anonymous]
# Sem acesso anônimo — quem acessa precisa autenticar no Grafana
enabled = false

[log]
mode = console
level = info

[analytics]
# Desabilita telemetria do Grafana (rede interna, sem necessidade)
reporting_enabled = false
check_for_updates = false
